name: build
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain info
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          SDK=$(xcrun --sdk iphoneos --show-sdk-path); echo "SDK=$SDK"

      - name: Build thin slices
        run: |
          set -eux
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)

          for ARCH in arm64 arm64e; do
            # 1) 汉化库（自带最小 iOS 头，不依赖 SDK 头文件）
            clang -target ${ARCH}-apple-ios15.0 -isysroot "$SDK" \
              -nostdinc -isystem src/iosmini \
              -fobjc-arc -O2 -dynamiclib -fno-omit-frame-pointer \
              -framework UIKit -framework Foundation -framework CoreFoundation -ldl \
              -Wl,-undefined,dynamic_lookup \
              -install_name /var/jb/Library/MobileSubstrate/DynamicLibraries/TriggrChinese.dylib \
              -o TriggrChinese-${ARCH}.dylib src/TriggrChinese.m

            # 2) 扩展动作（SpringBoard，走 libtriggr 注册接口）
            clang -target ${ARCH}-apple-ios15.0 -isysroot "$SDK" \
              -include stdlib.h -include string.h \
              -fobjc-arc -O2 -dynamiclib -fno-omit-frame-pointer \
              -framework UIKit -framework Foundation -framework CoreHaptics -ldl \
              -Wl,-undefined,dynamic_lookup \
              -install_name /var/jb/Library/MobileSubstrate/DynamicLibraries/TriggrActions.dylib \
              -o TriggrActions-${ARCH}.dylib ext/Tweak.m

            # 3) 返回上级中继（UIKit 进程）
            clang -target ${ARCH}-apple-ios15.0 -isysroot "$SDK" \
              -include stdlib.h -include string.h \
              -fobjc-arc -O2 -dynamiclib -fno-omit-frame-pointer \
              -framework UIKit -framework Foundation -ldl \
              -Wl,-undefined,dynamic_lookup \
              -install_name /var/jb/Library/MobileSubstrate/DynamicLibraries/TriggrBackRelay.dylib \
              -o TriggrBackRelay-${ARCH}.dylib ext/Relay.m
          done

          lipo -info *.dylib
          ls -la *.dylib
          for f in *.dylib; do
            echo "==== $f"
            otool -hv "$f" | tail -3
            otool -l "$f" | grep -E "LC_BUILD_VERSION|LC_DYLD_CHAINED_FIXUPS|LC_DYLD_INFO_ONLY" || true
          done
          echo "==== 汉化库中文抽查"; (strings -a TriggrChinese-arm64.dylib | grep -c "简体\|完成\|触发" || true)
          echo "==== 扩展动作抽查"; (strings -a TriggrActions-arm64.dylib | grep -c "扩展动作\|返回上级" || true)

      - uses: actions/upload-artifact@v4
        with:
          name: dylibs
          path: |
            TriggrChinese-arm64.dylib
            TriggrChinese-arm64e.dylib
            TriggrActions-arm64.dylib
            TriggrActions-arm64e.dylib
            TriggrBackRelay-arm64.dylib
            TriggrBackRelay-arm64e.dylib
